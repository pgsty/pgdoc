# 首页落地页 · 英文（结构与块类型见 Oink 文档 Landing 章节）
sections:
  - hero
  - metrics
  - cards
  - cta

hero:
  eyebrow: PostgreSQL 18.6 · Bilingual
  title_lines:
    - The PostgreSQL manual,
    - in two languages.
  desc: >
    The complete official documentation for PostgreSQL 18 — seven parts, the
    SQL command reference, and every appendix — with a Simplified Chinese
    translation on the facing page of every single document. Full-text search,
    dark mode, print view, and no build tools beyond Hugo.
  note: Generated from the upstream DocBook sources · pgdoc translation
  actions:
    - label: Read the tutorial
      url: docs/preface/
      icon: fa-solid fa-book-open
      style: primary
    - label: SQL Command Reference
      url: docs/reference/
      icon: fa-solid fa-terminal
      style: ghost

metrics:
  eyebrow: The whole book, nothing dropped
  title: What is inside
  desc: Converted from the official DocBook XML, keeping every table, example, note, and cross-reference.
  columns: 4
  items:
    - value: 7
      label: Parts
      desc: Tutorial through Internals
      icon: fa-solid fa-layer-group
    - value: 300+
      label: Reference pages
      desc: SQL commands, client tools, and server applications
      icon: fa-solid fa-terminal
    - value: 800+
      label: Bilingual pages
      desc: English and 简体中文, page for page
      icon: fa-solid fa-language
    - value: 2
      label: Languages
      desc: Switch on any page, anchors line up
      icon: fa-solid fa-code-branch

cards:
  eyebrow: Start reading
  title: The manual at a glance
  desc: Pick a part. The sidebar on the docs pages mirrors the structure of the printed manual.
  columns: 3
  items:
    - name: Tutorial
      icon: fa-solid fa-graduation-cap
      meta: Part I
      desc: A gentle introduction to SQL and PostgreSQL, from installation to transactions.
      url: docs/tutorial/
    - name: The SQL Language
      icon: fa-solid fa-database
      meta: Part II
      desc: Syntax, data types, functions, indexes, full-text search, and performance.
      url: docs/sql/
    - name: Server Administration
      icon: fa-solid fa-server
      meta: Part III
      desc: Installation, configuration, authentication, backup, replication, and monitoring.
      url: docs/admin/
    - name: Client Interfaces
      icon: fa-solid fa-plug
      meta: Part IV
      desc: libpq, large objects, ECPG, and the information schema.
      url: docs/client-interfaces/
    - name: Server Programming
      icon: fa-solid fa-code
      meta: Part V
      desc: Extending PostgreSQL — triggers, rules, PL/pgSQL, PL/Tcl, PL/Perl, PL/Python, and more.
      url: docs/server-programming/
    - name: Internals
      icon: fa-solid fa-microchip
      meta: Part VI
      desc: System catalogs, the wire protocol, index access methods, and genetic query optimization.
      url: docs/internals/
    - name: Reference
      icon: fa-solid fa-book
      meta: SQL Commands & Apps
      desc: Every SQL command, client application, and server program, alphabetically.
      url: docs/reference/
    - name: Appendixes
      icon: fa-solid fa-paperclip
      meta: Back matter
      desc: Error codes, date/time support, SQL keywords, glossary, and supplied modules.
      url: docs/appendixes/
    - name: Official upstream
      icon: fa-brands fa-osi
      meta: postgresql.org
      desc: The authoritative English original, including PDF and man pages.
      url: https://www.postgresql.org/docs/18/
      external: true

cta:
  title: One command builds it all
  desc: The site is generated from the DocBook sources in this repository — `make content` then `make build`.
  label: Browse the docs
  url: docs/
  style: primary
