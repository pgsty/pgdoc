# 首页落地页 · 中文
sections:
  - hero
  - metrics
  - cards
  - cta

hero:
  eyebrow: PostgreSQL 18.6 · 中英双语
  title_lines:
    - PostgreSQL 官方手册，
    - 一页英文，一页中文。
  desc: >
    PostgreSQL 18 完整官方文档——七个部分、SQL 命令参考与全部附录——每一页都配有简体中文译文，
    逐页对照。内置全文搜索、明暗主题与打印视图，构建只需一个 Hugo。
  note: 由上游 DocBook 源码生成 · pgdoc 中文翻译
  actions:
    - label: 阅读前言
      url: zh/docs/preface/
      icon: fa-solid fa-book-open
      style: primary
    - label: SQL 命令参考
      url: zh/docs/reference/
      icon: fa-solid fa-terminal
      style: ghost

metrics:
  eyebrow: 全书收录，一章不落
  title: 站点内容
  desc: 从官方 DocBook XML 转换而来，保留全部表格、示例、提示与交叉引用。
  columns: 4
  items:
    - value: 7
      label: 个部分
      desc: 从教程到内核
      icon: fa-solid fa-layer-group
    - value: 300+
      label: 页参考手册
      desc: SQL 命令、客户端与服务器程序
      icon: fa-solid fa-terminal
    - value: 800+
      label: 页双语页面
      desc: 英文与简体中文逐页对应
      icon: fa-solid fa-language
    - value: 2
      label: 种语言
      desc: 任意页面一键切换，锚点对齐
      icon: fa-solid fa-code-branch

cards:
  eyebrow: 开始阅读
  title: 手册总览
  desc: 选择一个部分。文档页的侧边栏与印刷版手册的目录结构一致。
  columns: 3
  items:
    - name: 教程
      icon: fa-solid fa-graduation-cap
      meta: 第 I 部分
      desc: SQL 与 PostgreSQL 入门：从安装到事务。
      url: zh/docs/tutorial/
    - name: SQL 语言
      icon: fa-solid fa-database
      meta: 第 II 部分
      desc: 语法、数据类型、函数、索引、全文检索与性能。
      url: zh/docs/sql/
    - name: 服务器管理
      icon: fa-solid fa-server
      meta: 第 III 部分
      desc: 安装、配置、认证、备份、复制与监控。
      url: zh/docs/admin/
    - name: 客户端接口
      icon: fa-solid fa-plug
      meta: 第 IV 部分
      desc: libpq、大对象、ECPG 与信息模式。
      url: zh/docs/client-interfaces/
    - name: 服务器编程
      icon: fa-solid fa-code
      meta: 第 V 部分
      desc: 扩展 PostgreSQL——触发器、规则、PL/pgSQL、PL/Tcl、PL/Perl、PL/Python 等。
      url: zh/docs/server-programming/
    - name: 内核
      icon: fa-solid fa-microchip
      meta: 第 VI 部分
      desc: 系统目录、通信协议、索引访问方法与基因查询优化。
      url: zh/docs/internals/
    - name: 参考
      icon: fa-solid fa-book
      meta: SQL 命令与应用
      desc: 全部 SQL 命令、客户端与服务器程序，按字母排序。
      url: zh/docs/reference/
    - name: 附录
      icon: fa-solid fa-paperclip
      meta: 后置内容
      desc: 错误代码、日期时间支持、SQL 关键字、术语表与附加模块。
      url: zh/docs/appendixes/
    - name: 官方原文
      icon: fa-brands fa-osi
      meta: postgresql.org
      desc: 权威英文原版，含 PDF 与手册页。
      url: https://www.postgresql.org/docs/18/
      external: true

cta:
  title: 一条命令构建全书
  desc: 本站由仓库内的 DocBook 源码生成——先 `make content`，再 `make build`。
  label: 浏览文档
  url: zh/docs/
  style: primary
