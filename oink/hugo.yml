# PostgreSQL 18 双语文档站 · Oink (Hugo Extended)
# 内容由 tools/convert.py 从 ../en/18.6 与 ../zh/18 的 DocBook SGML 生成。
baseURL: /
title: PostgreSQL 18 Documentation
theme: oink
defaultContentLanguage: en
enableRobotsTXT: true
enableGitInfo: false
disableKinds: [taxonomy, term]

markup:
  goldmark:
    renderer:
      unsafe: true                 # 转换器输出的行内锚点 span 需要
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true                # {caption=} / {.td-table--wide} 等属性行
  highlight:
    noClasses: false               # 代码高亮跟随明暗主题

outputs:
  home: [HTML, LLMS]
  section: [HTML, print, RSS, markdown]
  page: [HTML, markdown]

params:
  description: PostgreSQL 18 官方文档中英双语对照 · PostgreSQL 18 Documentation in English and Chinese
  version: 18.6
  offline_search: true
  offline_search_index: content    # 全文索引，直接搜到段落
  offline_search_summary_length: 90
  offline_search_max_results: 12
  copyright:
    authors: '[PostgreSQL Global Development Group](https://www.postgresql.org/)'
    from_year: 1996
  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    dark_mode: true
    sidebar_menu_foldable: true
    section_index: cards
    image_zoom: true
    backlinks: true                # 右栏静态反向链接
    feedback: false
  translation_notice: en           # 中文页显示「译自英文原版」并链接原文

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: PostgreSQL 18 Documentation
    params:
      description: The official PostgreSQL 18 documentation, with a side-by-side Simplified Chinese translation.
    menus:
      main:
        - identifier: docs
          name: Docs
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-book-open
        - identifier: upstream
          name: postgresql.org
          url: https://www.postgresql.org/docs/18/
          weight: 30
          params:
            icon: fa-brands fa-osi

  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    hasCJKLanguage: true
    title: PostgreSQL 18 中文文档
    params:
      description: PostgreSQL 18 官方文档中文翻译，与英文原版逐页对照。
    menus:
      main:
        - identifier: docs
          name: 文档
          pageRef: /docs
          weight: 10
          params:
            icon: fa-solid fa-book-open
        - identifier: upstream
          name: postgresql.org
          url: https://www.postgresql.org/docs/18/
          weight: 30
          params:
            icon: fa-brands fa-osi

module:
  hugoVersion:
    extended: true
    min: '0.168.0'
